# Stage 1 of the Security Guardian 2-stage workflow. This workflow is
# treated as untrusted: it runs with minimal, read-only permissions on
# every pull request (including forks). It only produces scan artifacts.
# The second workflow (`security-report.yml`) validates everything and
# posts the findings on the PR.
name: Security Guardian
on:
  pull_request:
    paths:
      - '**.js.snapshot**'

permissions:
  contents: read

jobs:
  log-skip:
    if: |
      startsWith(github.event.pull_request.title, 'chore(release):') ||
      startsWith(github.event.pull_request.title, 'chore(merge-back):')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipping Security Guardian for release/merge-back PR"
  run-security-guardian:
    if: |
      !startsWith(github.event.pull_request.title, 'chore(release):') &&
      !startsWith(github.event.pull_request.title, 'chore(merge-back):')
    runs-on: ubuntu-latest
    steps:
      # Check out the base branch so the security-guardian tool, rules, and
      # dependencies come from a trusted source rather than the fork's PR head.
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      # Fetch the PR head commit so the security-guardian tool can read it in
      # a later step. Fetch by SHA to pin the exact commit that triggered this
      # workflow.
      - name: Fetch PR head commit
        run: git fetch origin ${{ github.event.pull_request.head.sha }}

      - name: Install cfn-guard
        run: |
          mkdir -p $HOME/.local/bin
          curl -L -o cfn-guard.tar.gz https://github.com/aws-cloudformation/cloudformation-guard/releases/latest/download/cfn-guard-v3-x86_64-ubuntu-latest.tar.gz
          tar -xzf cfn-guard.tar.gz
          mv cfn-guard-v3-*/cfn-guard $HOME/.local/bin/cfn-guard
          chmod +x $HOME/.local/bin/cfn-guard
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install & Build security-guardian
        run: yarn install --frozen-lockfile && cd tools/@aws-cdk/security-guardian && yarn build

      - name: Run Security Guardian
        id: security-guardian
        uses: ./tools/@aws-cdk/security-guardian
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          rule_set_path: './tools/@aws-cdk/security-guardian/rules'

      - name: Upload Security Guardian XML Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-guardian-reports
          path: test-results/
