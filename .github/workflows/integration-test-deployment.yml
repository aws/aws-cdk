name: Integration Test deployment

permissions:
  id-token: write # This is required for requesting the OIDC JWT ID token

cache-mode: read

on:
  workflow_dispatch: {}
  merge_group: {}
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    branches:
      - main
    paths:
      - '**.js.snapshot**'

# In each PR, cancel any previous deployment integration test in progress for that PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  integration_test_deployment:
    runs-on: codebuild-aws-cdk-github-actions-deployment-integ-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 7200 # Maximum limit for self-hosted runners, job can still be limited by our runner timeout (which is set at 36 hours).
    environment: deployment-integ-test # Do not change or remove this without discussing with Appsec
    if: contains(github.event.pull_request.labels.*.name, 'pr/needs-integration-tests-deployment')
    name: 'Deploy integration test snapshots (requires `pr/needs-integration-tests-deployment` label)'

    env:
      PR_BUILD: true

    steps:
      - name: Checkout HEAD
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Required since actions/checkout v7 to check out fork PR code from a
          # pull_request_target workflow. Gated behind the
          # pr/needs-integration-tests-deployment label and the
          # deployment-integ-test environment on an isolated runner.
          allow-unsafe-pr-checkout: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Locate yarn cache
        id: yarn-cache-dir
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Restore yarn cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      # Main starts without the cache, so images that are no longer used aren't carried forward
      - name: Load Docker images
        id: docker-cache
        if: ${{ !(github.event_name == 'push' && github.ref_name == 'main') }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.docker-images.tar
          key: docker-images-${{ runner.os }}
          restore-keys: |
            docker-images-${{ runner.os }}-

      - name: Restore Docker images
        if: ${{ steps.docker-cache.outputs.cache-matched-key }}
        run: docker image load --input ~/.docker-images.tar

      - name: Restore build artifacts
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.s3buildcache
          key: s3buildcache-${{ runner.os }}

        #Increases vm.max_map_count for memory intensive jobs
      - name: Configure system settings for 
        run: |
          (command -v sysctl || sudo apt-get update && sudo apt-get install -y procps) && \
          sudo sysctl -w vm.max_map_count=2251954
        
      - name: Install dependencies for Integration Tests
        run: yarn install --frozen-lockfile
      
      - name: Build deployment-integ
        run: yarn --cwd tools/@aws-cdk/integration-test-deployment build
        
      # Build integration test packages: @aws-cdk-testing/framework-integ (stable tests) and @aws-cdk/* (alpha tests)
      - name: Build Integration Test packages 
        run: npx lerna run build --scope="{@aws-cdk/*,@aws-cdk-testing/framework-integ}"
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Run integration tests using integration-test-deployment script
        run: yarn run atmosphere-integ-test
        env:
          CDK_ATMOSPHERE_ENDPOINT: ${{ vars.CDK_ATMOSPHERE_ENDPOINT }}
          CDK_ATMOSPHERE_POOL: ${{ vars.CDK_ATMOSPHERE_POOL}}
          CDK_ATMOSPHERE_OIDC_ROLE: ${{ vars.CDK_ATMOSPHERE_OIDC_ROLE }}
          CDK_ATMOSPHERE_BATCH_SIZE: ${{ vars.CDK_ATMOSPHERE_BATCH_SIZE }}
          TARGET_BRANCH_COMMIT: ${{ github.event.pull_request.base.sha }}
          SOURCE_BRANCH_COMMIT: ${{ github.event.pull_request.head.sha }}
          
      # Only pulled images are cached, to avoid public registry rate limits.
      # Images built during the build have no repo digest and are left out.
      - name: Find pulled Docker images
        id: docker-images
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        run: |
          docker image list --format '{{ .Repository }}:{{ .Tag }}' | grep -v '<none>' | sort -u | while read -r image; do
            if [ "$(docker image inspect --format '{{ len .RepoDigests }}' "$image")" != "0" ]; then
              echo "$image"
            fi
          done > ~/.docker-images.txt
          cat ~/.docker-images.txt
          if [ -s ~/.docker-images.txt ]; then
            hash=$(xargs docker image inspect --format '{{ .Id }}' < ~/.docker-images.txt | sort | sha256sum | cut -c1-16)
            echo "key=docker-images-${RUNNER_OS}-${hash}" >> "$GITHUB_OUTPUT"
          fi

      - name: Look up Docker image cache
        id: docker-images-lookup
        if: ${{ steps.docker-images.outputs.key }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.docker-images.tar
          key: ${{ steps.docker-images.outputs.key }}
          lookup-only: true

      - name: Export Docker images
        if: ${{ steps.docker-images.outputs.key && steps.docker-images-lookup.outputs.cache-hit != 'true' }}
        run: |
          xargs docker image save --output ~/.docker-images.tar < ~/.docker-images.txt
          ls -lh ~/.docker-images.tar

      - name: Cache Docker images
        if: ${{ steps.docker-images.outputs.key && steps.docker-images-lookup.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.docker-images.tar
          key: ${{ steps.docker-images.outputs.key }}
