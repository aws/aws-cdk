name: Codebuild PR Build

on:
  workflow_dispatch: {}
  merge_group: {}
  push:
    branches:
      - main
      - v2-release
  pull_request: {}

# For every PR, cancel any previous builds in progress
# ... but for all other builds we keep them running
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Runner exists only for aws-cdk repo
    if: github.repository == 'aws/aws-cdk'
    runs-on: codebuild-aws-cdk-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}

    env:
      PR_BUILD: true
      JSII_SILENCE_WARNING_DEPRECATED_NODE_VERSION: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Locate yarn cache
        id: yarn-cache-dir
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Restore yarn cache
        id: yarn-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      # Main starts without the cache, so images that are no longer used aren't carried forward
      - name: Load Docker images
        id: docker-cache
        if: ${{ !(github.event_name == 'push' && github.ref_name == 'main') }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.docker-images.tar
          key: docker-images-${{ runner.os }}
          restore-keys: |
            docker-images-${{ runner.os }}-

      - name: Restore Docker images
        if: ${{ steps.docker-cache.outputs.cache-matched-key }}
        run: docker image load --input ~/.docker-images.tar

      - name: Restore build artifacts
        id: s3buildcache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.s3buildcache
          key: s3buildcache-${{ runner.os }}

      - name: Configure system settings
        run: |
          (command -v sysctl || sudo apt-get update && sudo apt-get install -y procps) && \
          sudo sysctl -w vm.max_map_count=2251954

      - name: Build
        run: /bin/bash ./build.sh --ci --concurrency 10

      - name: Run Rosetta
        run: /bin/bash ./scripts/run-rosetta.sh

      - name: Check for uncommitted changes
        run: git diff-index --exit-code --ignore-space-at-eol --stat HEAD

      - name: Save yarn cache
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' && steps.yarn-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Save build artifacts
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' && steps.s3buildcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.s3buildcache
          key: s3buildcache-${{ runner.os }}

      # Only pulled images are cached, to avoid public registry rate limits.
      # Images built during the build have no repo digest and are left out.
      - name: Find pulled Docker images
        id: docker-images
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        run: |
          docker image list --format '{{ .Repository }}:{{ .Tag }}' | grep -v '<none>' | sort -u | while read -r image; do
            if [ "$(docker image inspect --format '{{ len .RepoDigests }}' "$image")" != "0" ]; then
              echo "$image"
            fi
          done > ~/.docker-images.txt
          cat ~/.docker-images.txt
          if [ -s ~/.docker-images.txt ]; then
            hash=$(xargs docker image inspect --format '{{ .Id }}' < ~/.docker-images.txt | sort | sha256sum | cut -c1-16)
            echo "key=docker-images-${RUNNER_OS}-${hash}" >> "$GITHUB_OUTPUT"
          fi

      - name: Look up Docker image cache
        id: docker-images-lookup
        if: ${{ steps.docker-images.outputs.key }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.docker-images.tar
          key: ${{ steps.docker-images.outputs.key }}
          lookup-only: true

      - name: Export Docker images
        if: ${{ steps.docker-images.outputs.key && steps.docker-images-lookup.outputs.cache-hit != 'true' }}
        run: |
          xargs docker image save --output ~/.docker-images.tar < ~/.docker-images.txt
          ls -lh ~/.docker-images.tar

      - name: Cache Docker images
        if: ${{ steps.docker-images.outputs.key && steps.docker-images-lookup.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.docker-images.tar
          key: ${{ steps.docker-images.outputs.key }}

      - name: Save PR info for PR Linter
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p ./pr
          echo $PR_NUMBER > ./pr/pr_number
          echo $PR_SHA > ./pr/pr_sha

      - name: Upload PR info artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr_info
          path: pr/
